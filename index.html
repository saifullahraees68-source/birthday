<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0818">
<meta name="description" content="A birthday surprise, made just for you.">
<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<!-- ============================================================
     PERSONALIZATION — everything you may want to change lives here.
     ============================================================ -->
<script>
window.CONFIG = {
  herName: "Sahiba",
  myName: "",                          // signs the letter if filled in
  age: null,                           // e.g. 24 → shows "turning 24" above the title
  birthdayMonth: 11,
  birthdayDay: 10,
  dateLabel: "10 November",

  gateLines: ["Midnight has just passed.", "Which makes it officially your day."],
  gateButton: "Make a wish",

  heroSub: "May today be as lovely as you make ordinary days feel.",
  ticker: "Happy Birthday",

  cakeEyebrow: "the cake",
  cakeTitle: "First things first.",
  cakeStates: [
    { text: "Your cake is ready. It only needs a little light.", button: "Light the candles" },
    { text: "Close your eyes and make a wish. Take all the time you need.", button: "Blow them out" },
    { text: "Wish sent. I have a good feeling about this one.", button: "Make another wish" }
  ],

  clockEyebrow: "right now",
  clockTitle: "Your day, still unfolding",
  clockToday: "of your birthday left — let's make every minute count.",
  clockOther: "until your next birthday.",

  letterEyebrow: "a letter",
  letterTitle: "Something I wanted to say",
  sealHint: "tap the seal",
  letter: [
    "Happy birthday, {name}.",
    "I wanted to do something a little more thoughtful than a quick message, so I made you this small corner of the internet. It isn't much — but every bit of it was built with you in mind.",
    "I hope today is gentle with you and generous too: good food, loud laughter, people who make you feel celebrated, and a few quiet moments that belong only to you.",
    "You make ordinary days feel lighter. Today I just wanted to return the favour, even a little. Enjoy every minute of it."
  ],

  wishesEyebrow: "for you",
  wishesTitle: "Six wishes for today",
  wishes: [
    { title: "Soft beginnings",   text: "A slow, easy morning and nobody rushing you." },
    { title: "Loud laughter",     text: "The kind that makes your cheeks hurt." },
    { title: "Good news",         text: "Small, sudden and completely unexpected." },
    { title: "No guilt",          text: "Have the second slice. Birthday rules." },
    { title: "Real rest",         text: "The kind you don't have to earn first." },
    { title: "Being celebrated",  text: "Which, for the record, is already underway." }
  ],

  giftsEyebrow: "your gifts",
  giftsTitle: "Open them one by one",
  giftsSub: "Tap a gift to unwrap it. No expiry, no small print.",
  gifts: [
    { label: "For a long day",     text: "One evening, entirely your choice. I'll happily go wherever you point." },
    { label: "For a quiet moment", text: "A playlist made just for you. No skipping, no commentary." },
    { label: "For a bad day",      text: "One rescue mission, snacks and patience included." },
    { label: "For no reason",      text: "One very long hug. It ends when you say so." }
  ],

  finalEyebrow: "one last thing",
  finalTitle: "A toast, from me to you",
  finalButton: "Celebrate",
  finalLines: [
    "Here's to you, {name}.",
    "Happy Birthday.",
    "Go and enjoy every single minute of it."
  ],

  secret: "You found the hidden star. It only says: I'm really glad it's your birthday.",
  footer: "made with care, just for today"
};
</script>

<style>
/* ==================================================================
   TOKENS
   ================================================================== */
:root{
  --bg: #0D0818;
  --bg-2: #160B2B;
  --plum: #2A1245;
  --wine: #5A1740;
  --rose: #E3A79B;
  --blush: #F4D6D0;
  --gold: #E9C98A;
  --gold-hi: #FFF1CC;
  --gold-deep: #B98A4B;
  --ivory: #FBF3E8;
  --ink: #2B1633;
  --muted: rgba(251,243,232,.76);
  --line: rgba(233,201,138,.28);
  --glass: rgba(255,255,255,.045);

  --serif: 'Cormorant Garamond', 'Playfair Display', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --sans: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;

  --ease: cubic-bezier(.22,.61,.36,1);
  --out: cubic-bezier(.16,1,.3,1);

  --foil: linear-gradient(100deg, #B98A4B 0%, #F6E3B4 20%, #E9C98A 38%, #FFF6DC 50%, #D9AE67 68%, #9E7436 100%);
}

*, *::before, *::after{ box-sizing: border-box; margin: 0; padding: 0; }
html{ scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body{
  background: var(--bg);
  color: var(--ivory);
  font-family: var(--sans);
  font-weight: 300;
  font-size: 1.05rem;
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body.locked{ overflow: hidden; }
button{ font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
::selection{ background: var(--gold); color: var(--bg); }
:focus-visible{ outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 6px; }

.sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

.wrap{ width: min(1080px, 100% - 44px); margin-inline: auto; position: relative; }
section{ position: relative; padding: clamp(84px, 12vw, 150px) 0; }
.center{ text-align: center; }

/* ==================================================================
   BACKDROP — layered light, bokeh, film grain
   ================================================================== */
.bg{
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(1100px 700px at 85% -8%, rgba(190,70,130,.30), transparent 62%),
    radial-gradient(900px 650px at -5% 38%, rgba(96,44,150,.38), transparent 62%),
    radial-gradient(800px 600px at 60% 108%, rgba(233,201,138,.14), transparent 60%),
    linear-gradient(180deg, #0D0818 0%, #150A29 55%, #0D0818 100%);
}
.bk{
  position: absolute; border-radius: 50%; opacity: var(--o, .18);
  background: radial-gradient(circle, var(--c, #E9C98A) 0%, rgba(233,201,138,0) 68%);
  animation: drift var(--t, 30s) ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes drift{ from{ transform: translate3d(0,0,0) scale(1); } to{ transform: translate3d(var(--dx, 40px), var(--dy, -60px), 0) scale(1.15); } }
.cursor-glow{
  position: absolute; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(233,201,138,.13), transparent 65%); opacity: 0; transition: opacity .6s; will-change: transform;
}
.grain{
  position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: .055; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
main{ position: relative; z-index: 2; overflow-x: clip; }
#fx{ position: fixed; inset: 0; z-index: 900; pointer-events: none; }

/* ==================================================================
   TYPE + SHARED PIECES
   ================================================================== */
#hero-title:focus, .paper:focus{ outline: none; }
h1, h2, h3{ font-family: var(--serif); font-weight: 500; line-height: 1.04; letter-spacing: -.005em; }
.eyebrow{
  display: inline-flex; align-items: center; gap: 14px; color: var(--gold);
  font-size: .72rem; font-weight: 500; letter-spacing: .34em; text-transform: uppercase;
}
.eyebrow::before, .eyebrow::after{ content: ""; width: 34px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.eyebrow::after{ transform: scaleX(-1); }
.h2{ font-size: clamp(2.3rem, 5.6vw, 3.9rem); margin: 20px 0 16px; }
.lede{ color: var(--muted); max-width: 52ch; }
.center .h2, .center .lede{ margin-inline: auto; }

.foil{
  color: var(--gold);
  background: var(--foil); background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: shimmer 7s ease-in-out infinite alternate;
}
@keyframes shimmer{ from{ background-position: 0% 50%; } to{ background-position: 100% 50%; } }

.btn{
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; padding: 14px 38px; border-radius: 999px;
  background: var(--foil); background-size: 220% 100%; color: var(--bg);
  font-weight: 500; font-size: .86rem; letter-spacing: .2em; text-transform: uppercase;
  box-shadow: 0 10px 34px -10px rgba(233,201,138,.55), inset 0 1px 0 rgba(255,255,255,.55);
  transition: transform .4s var(--out), box-shadow .4s var(--ease), background-position 1s var(--ease);
}
.btn:hover{ transform: translateY(-3px); background-position: 100% 0; box-shadow: 0 18px 44px -12px rgba(233,201,138,.7), inset 0 1px 0 rgba(255,255,255,.6); }
.btn:active{ transform: translateY(0) scale(.98); }
.btn.ghost{ background: transparent; color: var(--gold); border: 1px solid var(--gold); box-shadow: none; }
.btn.ghost:hover{ background: rgba(233,201,138,.12); }

.reveal{ opacity: 0; transform: translateY(30px); filter: blur(6px); transition: opacity 1.1s var(--out), transform 1.1s var(--out), filter 1.1s var(--out); }
.reveal.in{ opacity: 1; transform: none; filter: none; }

/* ==================================================================
   GATE — a single candle at midnight
   ================================================================== */
#gate{
  position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; text-align: center; padding: 24px;
  background: radial-gradient(ellipse 60% 55% at 50% 56%, #2A1245 0%, #130A26 55%, #0A0612 100%);
  transition: opacity 1.3s var(--ease), visibility 1.3s; overflow: hidden;
}
#gate.gone{ opacity: 0; visibility: hidden; pointer-events: none; }
.spark{ position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 8px 2px rgba(233,201,138,.7); opacity: 0; animation: twinkle 4.4s ease-in-out infinite; }
@keyframes twinkle{ 0%,100%{ opacity: 0; transform: scale(.4); } 50%{ opacity: .95; transform: scale(1.25); } }
.gate-inner{ position: relative; max-width: 560px; display: flex; flex-direction: column; align-items: center; }
.gate-candle{ width: clamp(120px, 26vw, 168px); height: auto; margin-bottom: 8px; overflow: visible; }
.g-flame{ transform-box: fill-box; transform-origin: 50% 100%; animation: flick .32s ease-in-out infinite alternate; transition: opacity .5s, transform .6s var(--ease); }
.g-glow{ transform-box: fill-box; transform-origin: 50% 50%; animation: glowPulse 2.6s ease-in-out infinite alternate; transition: opacity .6s; }
@keyframes flick{ from{ transform: scale(1) rotate(-2.5deg); } to{ transform: scale(1.06,.95) rotate(2.5deg); } }
@keyframes glowPulse{ from{ opacity: .75; transform: scale(.95); } to{ opacity: 1; transform: scale(1.08); } }
#gate.blown .g-flame{ opacity: 0; transform: scale(.2); animation: none; }
#gate.blown .g-glow{ opacity: 0; animation: none; }
.g-smoke{ opacity: 0; }
#gate.blown .g-smoke{ animation: smokeUp 2s ease-out forwards; }
@keyframes smokeUp{ 0%{ opacity: .85; transform: translateY(0); } 100%{ opacity: 0; transform: translateY(-46px); } }
.gate-line{
  font-family: var(--serif); font-style: italic; font-size: clamp(1.5rem, 5.4vw, 2.5rem); line-height: 1.2;
  opacity: 0; transform: translateY(14px); filter: blur(6px); transition: opacity 1.4s var(--out), transform 1.4s var(--out), filter 1.4s var(--out);
  margin-bottom: 8px;
}
.gate-line:nth-of-type(2){ color: var(--gold); }
.gate-line.show{ opacity: 1; transform: none; filter: none; }
#begin{ margin-top: 34px; opacity: 0; pointer-events: none; transition: opacity 1.2s var(--ease), transform .4s var(--out), box-shadow .4s, background-position 1s; }
#begin.show{ opacity: 1; pointer-events: auto; }

/* ==================================================================
   HERO
   ================================================================== */
#hero{ min-height: 100svh; display: grid; place-items: center; text-align: center; overflow: hidden; padding: 84px 0 100px; }
.rings{ position: absolute; left: 50%; top: 50%; width: min(94vmin, 840px); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
.ring{
  position: absolute; inset: 0; border-radius: 50%; opacity: .75; animation: spin 70s linear infinite;
  background: conic-gradient(from 0deg, rgba(233,201,138,0) 0%, rgba(233,201,138,.95) 14%, rgba(233,201,138,0) 36%, rgba(227,167,155,.8) 62%, rgba(233,201,138,0) 82%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
}
.ring.r2{ inset: 8%; animation-duration: 110s; animation-direction: reverse; opacity: .45; }
.ring.r3{ inset: 17%; background: none; -webkit-mask: none; mask: none; border: 1px dashed rgba(233,201,138,.3); animation-duration: 160s; opacity: .8; }
.halo{ position: absolute; inset: 12%; border-radius: 50%; background: radial-gradient(circle, rgba(190,80,140,.30) 0%, rgba(120,50,160,.16) 40%, transparent 70%); filter: blur(10px); }
@keyframes spin{ to{ transform: rotate(360deg); } }

.hero-inner{ position: relative; z-index: 3; }
.rise{ opacity: 0; transform: translateY(26px); filter: blur(10px); }
.go .rise{ opacity: 1; transform: none; filter: none; transition: opacity 1.5s var(--out), transform 1.5s var(--out), filter 1.5s var(--out); transition-delay: calc(var(--d, 0) * 1ms); }
.hero-date{ margin-bottom: 26px; }
.hero-age{ display: block; margin-top: 8px; color: var(--blush); font-family: var(--serif); font-style: italic; letter-spacing: .08em; }
.hero-happy{ font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--blush); font-size: clamp(1.7rem, min(5.4vw, 6.2vh), 3.2rem); line-height: 1; margin-bottom: .1em; }
.hero-birthday{ font-size: clamp(3.3rem, min(13.5vw, 14.5vh), 9rem); font-weight: 500; letter-spacing: -.02em; line-height: .92; text-shadow: 0 6px 50px rgba(0,0,0,.45); }
.hero-name{ display: block; font-style: italic; font-weight: 500; font-size: clamp(4rem, min(20vw, 21vh), 12.5rem); line-height: 1.02; padding: .02em .08em .06em; margin-top: .02em; }
.flourish{ display: flex; align-items: center; justify-content: center; gap: 14px; margin: 22px auto 0; width: min(320px, 70%); color: var(--gold); }
.flourish i{ flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.flourish i:last-child{ transform: scaleX(-1); }
.hero-sub{ margin: 22px auto 0; max-width: 34ch; font-family: var(--serif); font-style: italic; font-size: clamp(1.2rem, 2.8vw, 1.65rem); line-height: 1.35; color: var(--muted); }
.scroll-hint{ position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: .66rem; letter-spacing: .34em; text-transform: uppercase; color: var(--gold); opacity: .8; }
.scroll-hint i{ width: 1px; height: 34px; background: linear-gradient(var(--gold), transparent); animation: nudge 2.2s ease-in-out infinite; transform-origin: top; }
@keyframes nudge{ 0%,100%{ transform: scaleY(.35); opacity: .4; } 50%{ transform: scaleY(1); opacity: 1; } }

/* metallic balloons */
.balloon{ position: absolute; z-index: 2; pointer-events: none; animation: bob var(--t, 9s) ease-in-out infinite alternate; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); }
.balloon svg{ display: block; width: 100%; height: auto; overflow: visible; }
@keyframes bob{ from{ transform: translateY(0) rotate(-3deg); } to{ transform: translateY(-20px) rotate(3deg); } }
@media (max-width: 720px){ .balloon.hide-sm{ display: none; } }

/* ticker */
.ticker{ position: relative; z-index: 2; border-block: 1px solid var(--line); background: rgba(13,8,24,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overflow: hidden; padding: 18px 0; }
.ticker-track{ display: flex; width: max-content; animation: slide 46s linear infinite; }
.ticker-track span{ font-family: var(--serif); font-style: italic; font-size: clamp(1.2rem, 3vw, 1.7rem); color: var(--gold); padding-right: 1.6rem; white-space: nowrap; }
.ticker-track span b{ font-style: normal; font-weight: 500; font-size: .7rem; letter-spacing: .4em; vertical-align: .18em; color: var(--rose); }
@keyframes slide{ to{ transform: translateX(-50%); } }

/* ==================================================================
   CAKE
   ================================================================== */
#cake{ overflow: hidden; transition: background 1.2s var(--ease); background: linear-gradient(180deg, transparent, rgba(10,5,20,0)); }
#cake[data-state="1"]{ background: linear-gradient(180deg, rgba(6,3,13,.55), rgba(6,3,13,.8) 50%, rgba(6,3,13,.55)); }
.cake-grid{ display: grid; gap: 40px; align-items: center; justify-items: center; text-align: center; }
@media (min-width: 900px){ .cake-grid{ grid-template-columns: 1fr 1fr; text-align: left; justify-items: stretch; } .cake-copy .h2{ margin-inline: 0; } }
#cake-status{ font-family: var(--serif); font-style: italic; font-size: clamp(1.25rem, 2.6vw, 1.6rem); line-height: 1.35; color: var(--blush); min-height: 3.6em; margin: 4px 0 24px; max-width: 28ch; }
@media (max-width: 899px){ #cake-status{ margin-inline: auto; } }
.cake-stage{ position: relative; width: min(440px, 92vw); }
.cake-stage::before{
  content: ""; position: absolute; left: 50%; top: 2%; width: 130%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, 0) scale(.6); opacity: 0;
  background: radial-gradient(circle, rgba(255,184,86,.40) 0%, rgba(233,150,90,.16) 38%, transparent 66%); transition: opacity 1.2s var(--ease), transform 1.2s var(--ease);
}
#cake[data-state="1"] .cake-stage::before{ opacity: 1; transform: translate(-50%, 0) scale(1); }
.cake-stage svg{ position: relative; width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 30px 40px rgba(0,0,0,.5)); }
.c-flame, .c-glow{ opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .5s, transform .7s var(--out); transform: scale(0); }
.c-glow{ transform-origin: 50% 50%; }
#cake[data-state="1"] .c-flame{ opacity: 1; transform: scale(1); animation: flick .34s ease-in-out infinite alternate; }
#cake[data-state="1"] .c-glow{ opacity: 1; transform: scale(1); animation: glowPulse 2.2s ease-in-out infinite alternate; }
.c-smoke{ opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
#cake[data-state="2"] .c-smoke{ animation: smokeUp 2.6s ease-out forwards; }

/* ==================================================================
   CLOCK
   ================================================================== */
.clock-ring{ position: relative; width: min(300px, 76vw); aspect-ratio: 1; margin: 44px auto 0; }
.clock-ring svg{ width: 100%; height: 100%; display: block; overflow: visible; }
.ring-track{ fill: none; stroke: rgba(233,201,138,.16); stroke-width: 2; }
.ring-prog{ fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 100px 100px; filter: drop-shadow(0 0 6px rgba(233,201,138,.7)); transition: stroke-dashoffset 1s linear; }
.ring-ticks{ stroke: rgba(233,201,138,.35); stroke-width: 1; }
.clock-text{ position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
#clock-main{ font-family: var(--serif); font-weight: 500; font-size: clamp(2.1rem, 8.4vw, 3rem); font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1; }
#clock-sub{ margin-top: 8px; font-size: .66rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.clock-caption{ margin: 30px auto 0; max-width: 34ch; font-family: var(--serif); font-style: italic; font-size: clamp(1.2rem, 2.6vw, 1.5rem); color: var(--muted); }

/* ==================================================================
   LETTER — wax seal
   ================================================================== */
.letter-stage{ margin-top: 48px; display: flex; flex-direction: column; align-items: center; }
.seal{
  position: relative; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; z-index: 2;
  background: radial-gradient(circle at 34% 28%, #F3D9A4 0%, #D9AE67 38%, #A9783A 78%, #7C5524 100%);
  box-shadow: 0 14px 34px -8px rgba(0,0,0,.65), inset 0 2px 3px rgba(255,255,255,.5), inset 0 -6px 10px rgba(80,44,10,.45);
  transition: transform .6s var(--out), opacity .6s, box-shadow .4s;
}
.seal::before{ content: ""; position: absolute; inset: 9px; border-radius: 50%; border: 1px solid rgba(60,30,6,.4); box-shadow: inset 0 1px 2px rgba(255,255,255,.35); }
.seal:hover{ transform: scale(1.05) rotate(-4deg); }
.seal-mark{ font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 3rem; line-height: 1; color: rgba(70,36,8,.85); text-shadow: 0 1px 0 rgba(255,255,255,.4); }
.seal-hint{ margin-top: 18px; font-size: .68rem; letter-spacing: .34em; text-transform: uppercase; color: var(--gold); transition: opacity .5s; }
.letter-stage.open .seal{ transform: scale(.55) translateY(-10px); opacity: .0; pointer-events: none; height: 0; margin-bottom: -40px; }
.letter-stage.open .seal-hint{ opacity: 0; height: 0; margin: 0; overflow: hidden; }
.paper-wrap{ display: grid; grid-template-rows: 0fr; width: 100%; max-width: 660px; transition: grid-template-rows 1.4s var(--out); }
.letter-stage.open .paper-wrap{ grid-template-rows: 1fr; }
.paper-clip{ overflow: hidden; min-height: 0; }
.paper{
  position: relative; margin: 6px 6px 18px; padding: clamp(34px, 6vw, 58px) clamp(26px, 6vw, 60px);
  background: linear-gradient(165deg, #FFFBF2 0%, #F8EBD7 100%); color: var(--ink); border-radius: 6px;
  box-shadow: 0 40px 70px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(233,201,138,.5);
}
.paper::before{ content: ""; position: absolute; inset: 10px; border: 1px solid rgba(185,138,75,.55); border-radius: 3px; pointer-events: none; }
.paper p{ font-family: var(--serif); font-size: clamp(1.18rem, 2.3vw, 1.4rem); line-height: 1.6; margin-bottom: 1.1em; opacity: 0; transform: translateY(10px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
.paper p:first-child{ font-size: clamp(1.9rem, 4.4vw, 2.6rem); font-style: italic; line-height: 1.15; color: #7A2A52; margin-bottom: .7em; }
.paper .sign{ font-style: italic; color: #7A2A52; text-align: right; margin: 6px 0 0; }
.letter-stage.open .paper p{ opacity: 1; transform: none; }

/* ==================================================================
   WISHES
   ================================================================== */
.wish-grid{ display: grid; gap: 20px; margin-top: 54px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
@media (min-width: 940px){ .wish-grid{ grid-template-columns: repeat(3, 1fr); } }
.wish{
  --mx: 50%; --my: 0%;
  position: relative; padding: 34px 30px 36px; border-radius: 20px; overflow: hidden;
  background: radial-gradient(420px circle at var(--mx) var(--my), rgba(233,201,138,.16), transparent 60%), var(--glass);
  border: 1px solid rgba(233,201,138,.22); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .5s var(--out), border-color .4s; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
}
.wish:hover{ border-color: rgba(233,201,138,.6); }
.wish-no{ display: block; font-family: var(--serif); font-style: italic; font-size: 2rem; line-height: 1; color: var(--gold); margin-bottom: 22px; }
.wish h3{ font-size: 1.7rem; margin-bottom: 10px; }
.wish p{ color: var(--muted); font-size: .98rem; }

/* ==================================================================
   GIFTS — flip cards
   ================================================================== */
.gift-grid{ display: grid; gap: 22px; margin-top: 54px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.gift{ display: block; perspective: 1200px; height: 250px; width: 100%; text-align: center; }
.gift-inner{ display: block; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1.1s var(--out); }
.gift[aria-pressed="true"] .gift-inner{ transform: rotateY(180deg); }
.face{ position: absolute; inset: 0; border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 26px; overflow: hidden; }
.face.front{
  background: linear-gradient(155deg, #3A1B5C 0%, #22103D 55%, #170A2A 100%); border: 1px solid rgba(233,201,138,.4);
  box-shadow: 0 24px 40px -22px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);
}
.face.front::before, .face.front::after{ content: ""; position: absolute; background: var(--foil); opacity: .95; }
.face.front::before{ left: 0; right: 0; top: 50%; height: 16px; transform: translateY(-50%); opacity: .85; }
.face.front::after{ top: 0; bottom: 0; left: 50%; width: 16px; transform: translateX(-50%); opacity: .85; }
.gift:hover .face.front{ border-color: var(--gold); }
.bow{ position: relative; z-index: 2; width: 64px; height: 44px; margin-bottom: 14px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
.tag{ position: relative; z-index: 2; background: #170A2A; padding: 8px 18px; border: 1px solid rgba(233,201,138,.55); border-radius: 999px; }
.tag b{ display: block; font-family: var(--serif); font-size: 1.18rem; font-weight: 500; color: var(--gold-hi); line-height: 1.2; }
.tag small{ display: block; font-size: .6rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-top: 3px; }
.face.back{
  transform: rotateY(180deg); color: var(--ink); background: linear-gradient(160deg, #FFF8EA 0%, #F2DDB6 100%);
  border: 1px solid rgba(233,201,138,.8); box-shadow: 0 24px 40px -22px rgba(0,0,0,.8);
}
.face.back::before{ content: ""; position: absolute; inset: 9px; border: 1px solid rgba(185,138,75,.55); border-radius: 13px; }
.face.back small{ display: block; font-size: .62rem; letter-spacing: .32em; text-transform: uppercase; color: #8A5E24; margin-bottom: 12px; }
.face.back .gtext{ display: block; position: relative; font-family: var(--serif); font-style: italic; font-size: 1.32rem; line-height: 1.3; font-weight: 500; }

/* ==================================================================
   FINALE
   ================================================================== */
#finale{ min-height: 92svh; display: grid; place-items: center; text-align: center; overflow: hidden; }
#finale::before{ content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(190,70,130,.22), rgba(90,40,150,.14) 45%, transparent 72%); pointer-events: none; }
.finale-lines{ display: none; position: relative; }
.finale-lines.show{ display: block; }
.fline{ font-family: var(--serif); font-style: italic; font-size: clamp(1.5rem, 4.4vw, 2.4rem); line-height: 1.2; color: var(--blush); margin-bottom: 18px; opacity: 0; transform: translateY(18px); filter: blur(6px); transition: opacity 1.4s var(--out), transform 1.4s var(--out), filter 1.4s var(--out); }
.fline.in{ opacity: 1; transform: none; filter: none; }
.fline.big{ font-style: normal; font-weight: 500; font-size: clamp(3.4rem, 13vw, 9rem); line-height: .95; letter-spacing: -.02em; margin: 6px 0 20px; }
.fline.sign{ font-size: 1.4rem; color: var(--gold); }
footer{ padding: 70px 0 120px; text-align: center; position: relative; z-index: 2; border-top: 1px solid var(--line); }
#secret-star{ width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--line); color: var(--gold); font-size: 1.3rem; transition: transform .6s var(--out), border-color .3s, background .3s; }
#secret-star:hover{ transform: rotate(72deg) scale(1.08); border-color: var(--gold); background: rgba(233,201,138,.1); }
#secret-msg{ max-width: 38ch; margin: 22px auto 0; font-family: var(--serif); font-style: italic; font-size: 1.3rem; line-height: 1.35; color: var(--blush); max-height: 0; opacity: 0; overflow: hidden; transition: max-height .8s var(--ease), opacity .8s; }
#secret-msg.show{ max-height: 220px; opacity: 1; }
.foot-note{ margin-top: 40px; font-size: .68rem; letter-spacing: .3em; text-transform: uppercase; color: rgba(233,201,138,.7); }

#sound{
  position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 950; min-height: 48px; padding: 10px 20px; border-radius: 999px;

}

#sound.on .eq i{ animation: eq .8s ease-in-out infinite alternate; }
#sound.on .eq i:nth-child(2){ animation-delay: .2s; } #sound.on .eq i:nth-child(3){ animation-delay: .4s; }
@keyframes eq{ to{ height: 14px; } }

/* ==================================================================

   ================================================================== */
@media (prefers-reduced-motion: reduce){

  .gift-inner{ transition: none; }
}

/* ---------------------------------------------------------
   FIREWORK + CONFETTI ENGINE (single canvas, only runs while needed)
   --------------------------------------------------------- */
var cv = $("fx"), cx = cv.getContext("2d"), W = 0, H = 0;
var sparks = [], rockets = [], papers = [], running = false, last = 0;
var PALS = [
  { h: [38, 46], s: 92, l: 66 },   // champagne gold
  { h: [12, 20], s: 80, l: 74 },   // rose gold
  { h: [345, 355], s: 70, l: 82 }, // blush
  { h: [318, 332], s: 70, l: 68 }, // orchid
  { h: [40, 44], s: 40, l: 96 }    // pearl white
];
var PAPER = ["#E9C98A", "#F6E3B4", "#B98A4B", "#E3A79B", "#F4D6D0", "#FBF3E8", "#FFF1CC"];

function sizeCanvas(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas(); window.addEventListener("resize", sizeCanvas);

function start(){ if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); } }

function explode(x, y, kind, pal){
  if (sparks.length > 1500) return;
  var n = small() ? 95 : 150, i, a, v;
  if (kind === "willow") n = Math.round(n * .8);
  for (i = 0; i < n; i++){
    if (kind === "ring"){ a = i / n * Math.PI * 2; v = small() ? 4.6 : 5.6; }
    else { a = Math.random() * Math.PI * 2; v = (kind === "willow" ? rand(1.4, 4.6) : rand(1.2, 7.4) * (Math.random() < .5 ? 1 : Math.sqrt(Math.random()) + .4)); if (small()) v *= .78; }
    var white = Math.random() < .12, p = white ? PALS[4] : pal;
    sparks.push({
      x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: kind === "willow" ? rand(110, 170) : rand(65, 110),
      h: rand(p.h[0], p.h[1]), s: p.s, l: p.l, w: rand(1.7, 3.2), drag: kind === "willow" ? .98 : .972, g: kind === "willow" ? .05 : .035
    });
  }
  // soft flash
  sparks.push({ x: x, y: y, vx: 0, vy: 0, life: 0, max: 10, h: 44, s: 60, l: 95, w: 44, drag: 1, g: 0, flash: true });
  pop();
}

function launch(x, rise){
  if (reduced) return;
  var g = .16, r = (rise || rand(.45, .72)) * H;
  rockets.push({ x: x == null ? rand(W * .15, W * .85) : x, y: H + 8, px: 0, py: 0, vx: rand(-.5, .5), vy: -Math.sqrt(2 * g * r), pal: pick(PALS.slice(0, 4)), kind: pick(["peony", "peony", "ring", "willow"]) });
  start();
}
function show(count, gap){ if (reduced) return; for (var i = 0; i < count; i++) wait(function(){ launch(); }, i * gap + rand(0, 160)); }

function paper(x, y, n, spread){
  if (reduced) return;
  n = Math.min(n, small() ? 70 : 120);
  for (var i = 0; i < n; i++){
    var a = (-90 + rand(-spread, spread)) * Math.PI / 180, v = rand(5, 15);
    papers.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: rand(6, 11), h: rand(9, 16), rot: rand(0, 6.28), vr: rand(-.25, .25), f: rand(0, 6.28), vf: rand(.12, .3), c: pick(PAPER), life: 0, max: rand(130, 210) });
  }
  start();
}
function rain(n){
  if (reduced) return;
  for (var i = 0; i < n; i++) papers.push({ x: rand(0, W), y: rand(-H * .3, -10), vx: rand(-.8, .8), vy: rand(1, 3), w: rand(6, 11), h: rand(9, 16), rot: rand(0, 6.28), vr: rand(-.12, .12), f: rand(0, 6.28), vf: rand(.06, .16), c: pick(PAPER), life: 0, max: rand(220, 340), rain: true });
  start();
}

function frame(t){
  if (!running) return;
  var dt = Math.min(2.2, (t - last) / 16.67 || 1); last = t;
  cx.clearRect(0, 0, W, H);
  cx.globalCompositeOperation = "lighter";
  cx.lineCap = "round";
  var i, p;

  for (i = rockets.length - 1; i >= 0; i--){
    p = rockets[i]; p.px = p.x; p.py = p.y;
    p.vy += .16 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    cx.strokeStyle = "rgba(255,236,190,.9)"; cx.lineWidth = 2.2;
    cx.beginPath(); cx.moveTo(p.x - p.vx * 5, p.y - p.vy * 5); cx.lineTo(p.x, p.y); cx.stroke();
    if (Math.random() < .6) sparks.push({ x: p.x, y: p.y, vx: rand(-.3, .3), vy: rand(.2, .8), life: 0, max: rand(14, 26), h: 40, s: 90, l: 70, w: 1, drag: .95, g: .02 });
    if (p.vy >= -.6){ explode(p.x, p.y, p.kind, p.pal); rockets.splice(i, 1); }
  }

  for (i = sparks.length - 1; i >= 0; i--){
    p = sparks[i];
    p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
    var k = 1 - p.life / p.max;
    if (k <= 0){ sparks.splice(i, 1); continue; }
    if (p.flash){
      var gr = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.w * 5);
      gr.addColorStop(0, "rgba(255,244,214," + (k * .7) + ")"); gr.addColorStop(1, "rgba(255,244,214,0)");
      cx.fillStyle = gr; cx.beginPath(); cx.arc(p.x, p.y, p.w * 5, 0, 6.283); cx.fill(); continue;
    }
    cx.strokeStyle = "hsla(" + p.h + "," + p.s + "%," + p.l + "%," + Math.min(1, k * 1.4) + ")";
    cx.lineWidth = p.w * (.35 + .65 * k);
    cx.beginPath(); cx.moveTo(p.x - p.vx * 3, p.y - p.vy * 3); cx.lineTo(p.x, p.y); cx.stroke();
  }

  cx.globalCompositeOperation = "source-over";
  for (i = papers.length - 1; i >= 0; i--){
    p = papers[i]; p.life += dt;
    p.vy += (p.rain ? .015 : .13) * dt; p.vx *= Math.pow(.992, dt);
    p.f += p.vf * dt; p.rot += p.vr * dt; p.x += (p.vx + Math.sin(p.f * .7) * .5) * dt; p.y += p.vy * dt;
    if (p.life > p.max || p.y > H + 30){ papers.splice(i, 1); continue; }
    var f = p.max * .75, al = p.life > f ? 1 - (p.life - f) / (p.max - f) : 1;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.scale(1, Math.cos(p.f)); cx.globalAlpha = Math.max(0, al);
    cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  cx.globalAlpha = 1;

  if (!rockets.length && !sparks.length && !papers.length){ running = false; cx.clearRect(0, 0, W, H); return; }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------
   Sound — synthesized only, opt-in
   --------------------------------------------------------- */
var sfx = { on: false, ctx: null };
function actx(){ if (!sfx.ctx){ try { sfx.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { sfx.ctx = null; } } return sfx.ctx; }
function note(f, at, dur, vol){
  var c = sfx.ctx; if (!c) return;
  [[1, 1], [2, .22], [3, .08]].forEach(function(h){
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = "sine"; o.frequency.value = f * h[0];
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime((vol || .09) * h[1], t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
  });
}
function chime(){ if (!sfx.on || !actx()) return; note(880, 0, .7, .08); note(1318.5, .1, .9, .07); }
function pop(){
  if (!sfx.on || !actx()) return;
  var c = sfx.ctx, len = Math.floor(c.sampleRate * .35), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = "lowpass"; f.frequency.value = rand(500, 1100); g.gain.value = .22;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
function fanfare(){ if (!sfx.on || !actx()) return; [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f, i){ note(f, i * .09, 1.1, .08); }); }

/* ---------------------------------------------------------
   Reveal on scroll
   --------------------------------------------------------- */
(function(){
  var els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)){ els.forEach(function(e){ e.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function(en){
    en.forEach(function(x, i){ if (!x.isIntersecting) return; var el = x.target; wait(function(){ el.classList.add("in"); }, reduced ? 0 : (i % 4) * 110); io.unobserve(el); });
  }, { threshold: .12 });
  els.forEach(function(e){ io.observe(e); });
})();

/* ---------------------------------------------------------
   Clock ring
   --------------------------------------------------------- */
(function(){
  var ticks = "", i; for (i = 0; i < 60; i++){ var a = i * 6 * Math.PI / 180, r1 = i % 5 ? 96 : 94, r2 = 99; ticks += '<line x1="' + (100 + Math.sin(a) * r1) + '" y1="' + (100 - Math.cos(a) * r1) + '" x2="' + (100 + Math.sin(a) * r2) + '" y2="' + (100 - Math.cos(a) * r2) + '"/>'; }
  $("ticks").innerHTML = ticks;
  var CIRC = 565.49, m = C.birthdayMonth || 1, d = C.birthdayDay || 1;
  function tick(){
    var now = new Date(), today = (now.getMonth() + 1 === m && now.getDate() === d), main, sub, prog, cap;
    if (today){
      var s0 = new Date(now.getFullYear(), m - 1, d, 0, 0, 0), e0 = new Date(now.getFullYear(), m - 1, d + 1, 0, 0, 0), left = Math.max(0, e0 - now);
      main = pad(Math.floor(left / 36e5)) + ":" + pad(Math.floor(left % 36e5 / 6e4)) + ":" + pad(Math.floor(left % 6e4 / 1e3));
      sub = "remaining"; prog = (now - s0) / (e0 - s0); cap = C.clockToday;
    } else {
      var tg = new Date(now.getFullYear(), m - 1, d, 0, 0, 0); if (tg <= now) tg = new Date(now.getFullYear() + 1, m - 1, d, 0, 0, 0);
      var df = tg - now, D = Math.floor(df / 864e5);
      main = D + "d " + pad(Math.floor(df % 864e5 / 36e5)) + "h " + pad(Math.floor(df % 36e5 / 6e4)) + "m"; sub = "to go"; prog = 1 - df / (365 * 864e5); cap = C.clockOther;
    }
    prog = Math.max(0, Math.min(1, prog));
    $("clock-main").textContent = main; $("clock-sub").textContent = sub; $("clock-caption").textContent = cap || "";
    $("ring-prog").style.strokeDashoffset = (CIRC * (1 - prog)).toFixed(2);
    $("ring-dot").setAttribute("transform", "rotate(" + (prog * 360).toFixed(2) + " 100 100)");
  }
  tick(); setInterval(tick, 1000);
})();

   --------------------------------------------------------- */
(function(){
  var seal = $("seal"), stage = $("letter-stage"), wrap = $("paper-wrap"), pap = $("paper");
  pap.setAttribute("inert", ""); wrap.setAttribute("aria-hidden", "true");
  seal.addEventListener("click", function(){
    if (stage.classList.contains("open")) return;
    stage.classList.add("open"); seal.setAttribute("aria-expanded", "true");
    wrap.removeAttribute("aria-hidden"); pap.removeAttribute("inert");
    var r = seal.getBoundingClientRect(); paper(r.left + r.width / 2, r.top + r.height / 2, 40, 80);
    if (sfx.on) chime();
    wait(function(){ pap.setAttribute("tabindex", "-1"); pap.focus({ preventScroll: true }); pap.style.outline = "none"; }, 400);
  });
})();

/* ---------------------------------------------------------
   Wish cards: spotlight + gentle tilt (fine pointers only)
   --------------------------------------------------------- */
(function(){
  if (!fine || reduced) return;
  document.querySelectorAll(".wish").forEach(function(c){
    c.addEventListener("pointermove", function(e){
      var r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      c.style.setProperty("--mx", (x * 100) + "%"); c.style.setProperty("--my", (y * 100) + "%");
      c.style.setProperty("--ry", ((x - .5) * 8).toFixed(2) + "deg"); c.style.setProperty("--rx", ((.5 - y) * 8).toFixed(2) + "deg");
    });
    c.addEventListener("pointerleave", function(){ c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); });
  });
})();

/* ---------------------------------------------------------
   Finale
   --------------------------------------------------------- */
(function(){
  var btn = $("finale-btn"), teaser = $("finale-teaser"), lines = $("finale-lines"), done = false;
  btn.addEventListener("click", function(){
    if (done) return; done = true;
    teaser.style.display = "none"; lines.classList.add("show");
    lines.querySelectorAll(".fline").forEach(function(l, i){ wait(function(){ l.classList.add("in"); }, reduced ? 0 : 350 + i * 900); });
    fanfare();
    show(small() ? 9 : 13, 520);
    paper(W * .5, H * .62, 110, 80); wait(function(){ rain(small() ? 50 : 90); }, 600);
  });
})();

/* ---------------------------------------------------------
   Secret star
   --------------------------------------------------------- */
(function(){
  var b = $("secret-star"), m = $("secret-msg");
  b.addEventListener("click", function(){
    var open = m.classList.toggle("show"); b.setAttribute("aria-expanded", open ? "true" : "false");
    if (open){ var r = b.getBoundingClientRect(); paper(r.left + r.width / 2, r.top + r.height / 2, 24, 80); if (sfx.on) chime(); }
  });
})();

/* ---------------------------------------------------------
   Melody toggle (music-box timbre, synthesized)
   --------------------------------------------------------- */
(function(){
  var btn = $("sound"), label = $("sound-label"), timers = [];
  var G4 = 392, A4 = 440, B4 = 493.88, C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99;
  var tune = [[G4,0,.75],[G4,.75,.25],[A4,1,1],[G4,2,1],[C5,3,1],[B4,4,2],[G4,6,.75],[G4,6.75,.25],[A4,7,1],[G4,8,1],[D5,9,1],[C5,10,2],
              [G4,12,.75],[G4,12.75,.25],[G5,13,1],[E5,14,1],[C5,15,1],[B4,16,1],[A4,17,1],[F5,18,.75],[F5,18.75,.25],[E5,19,1],[C5,20,1],[D5,21,1],[C5,22,2.4]];
  var beat = .55;
  btn.addEventListener("click", function(){
    if (sfx.on){
      timers.forEach(clearTimeout); timers = []; sfx.on = false;
      if (sfx.ctx){ try { sfx.ctx.close(); } catch (e) {} sfx.ctx = null; }
      btn.classList.remove("on"); btn.setAttribute("aria-pressed", "false"); btn.setAttribute("aria-label", "Play a soft birthday melody"); label.textContent = "melody"; return;
    }
    if (!actx()) return; if (sfx.ctx.state === "suspended") sfx.ctx.resume();
    sfx.on = true; btn.classList.add("on"); btn.setAttribute("aria-pressed", "true"); btn.setAttribute("aria-label", "Turn the melody and sound effects off"); label.textContent = "sound on";
    tune.forEach(function(n){ note(n[0], n[1] * beat, Math.max(.5, n[2] * beat * 1.8), .1); });
  });
})();

})();
</script>
</body>
</html>
